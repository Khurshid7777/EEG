# Neurophysiological rule base (TZ §8.1, §18.3). NOT hardcoded — this YAML is
# the configurable knowledge graph consumed by Layer 5 (rules_engine).
#
# Each chain maps a condition (events present/absent + clinical context) to a
# cause -> effect edge with a physiology label and confidence. Artifact-vs-real
# discrimination is expressed as a chain that "resolves_artifact_for" an event.
# Increment 64 (docs/rule_base_audit_2026-11-19.md): conclusions rewritten as probabilities with a differential, context
# conditions (context_present / context_absent) used for triphasic waves; `confidence` values are hand-set and NOT calibrated.
version: "0.2.0"
chains:
  # 1) Diffuse slowing -> encephalopathy (with metabolic/toxic/hypoxic differential)
  - id: diffuse_slowing_encephalopathy
    description_ru: >-
      Диффузное замедление фона указывает на энцефалопатию; дифференциал —
      метаболическая/токсическая/гипоксическая (уточняется контекстом); учитывать возраст, сонливость и препараты.
    when:
      any_event: [diffuse_slowing]
      context_absent: [sedatives]
    cause_ru: Диффузное замедление фоновой активности
    cause_uz: Fon faolligining diffuz sekinlashuvi
    effect_ru: Возможна энцефалопатия (метаболическая/токсическая/гипоксическая — по контексту; учесть возраст, сонливость, препараты)
    effect_uz: Ensefalopatiya mumkin (kontekstga ko‘ra metabolik/toksik/gipoksik; yosh, uyquchanlik, dorilarni hisobga oling)
    physiology: pathologic
    confidence: 0.7

  # 1b) Diffuse slowing with stated sedation (increment 66, DOSE-I: propofol sedation made the detector fire in 76% of recordings vs 0% awake)
  - id: diffuse_slowing_sedation
    description_ru: >-
      Диффузное замедление при указанных седативных препаратах: согласуется с эффектом седации (обратимая причина);
      энцефалопатия не утверждается без записи вне седации.
    when:
      any_event: [diffuse_slowing]
      context_present: [sedatives]
    cause_ru: "Диффузное замедление фоновой активности (контекст: седация)"
    cause_uz: "Fon faolligining diffuz sekinlashuvi (kontekst: sedatsiya)"
    effect_ru: "Согласуется с эффектом седативных препаратов (обратимая причина); энцефалопатия не утверждается без записи вне седации"
    effect_uz: "Sedativ dorilar ta'siriga mos keladi (qaytar sabab); sedatsiyasiz yozuvsiz ensefalopatiya tasdiqlanmaydi"
    physiology: uncertain
    confidence: 0.6

  # 2) Triphasic waves are NONSPECIFIC; the metabolic conclusion needs hepatic/renal context (increment 64)
  - id: triphasic_metabolic_hepatic
    description_ru: >-
      Трифазные волны при указанной печёночной недостаточности — согласуются с печёночной энцефалопатией
      (паттерн неспецифичен; клиническая корреляция обязательна).
    when:
      any_event: [triphasic_waves]
      context_present: [hepatic_failure]
    cause_ru: "Трифазные волны (контекст: печёночная недостаточность)"
    cause_uz: "Uch fazali to‘lqinlar (kontekst: jigar yetishmovchiligi)"
    effect_ru: Согласуется с печёночной энцефалопатией (паттерн неспецифичен)
    effect_uz: Jigar ensefalopatiyasiga mos keladi (pattern nospetsifik)
    physiology: pathologic
    confidence: 0.65

  - id: triphasic_metabolic_renal
    description_ru: >-
      Трифазные волны при указанной почечной недостаточности — согласуются с уремической/метаболической энцефалопатией
      (паттерн неспецифичен; клиническая корреляция обязательна).
    when:
      any_event: [triphasic_waves]
      context_present: [renal_failure]
    cause_ru: "Трифазные волны (контекст: почечная недостаточность)"
    cause_uz: "Uch fazali to‘lqinlar (kontekst: buyrak yetishmovchiligi)"
    effect_ru: Согласуется с уремической/метаболической энцефалопатией (паттерн неспецифичен)
    effect_uz: Uremik/metabolik ensefalopatiyaga mos keladi (pattern nospetsifik)
    physiology: pathologic
    confidence: 0.65

  - id: triphasic_nonspecific
    description_ru: >-
      Трифазные волны без указанной печёночной/почечной недостаточности: паттерн неспецифичен, дифференциал —
      метаболическая (печёночная, почечная), токсическая, гипоксическая, септическая энцефалопатия и др.;
      визуально может напоминать GPDs.
    when:
      any_event: [triphasic_waves]
      context_absent: [hepatic_failure, renal_failure]
    cause_ru: Трифазные волны
    cause_uz: Uch fazali to‘lqinlar
    effect_ru: "Неспецифично: энцефалопатия разной природы (метаболическая, токсическая, гипоксическая и др.); нужен клинический контекст"
    effect_uz: "Nospetsifik: turli xil ensefalopatiya (metabolik, toksik, gipoksik va b.); klinik kontekst kerak"
    physiology: pathologic
    confidence: 0.5

  # 3) LPDs -> acute structural process (on the IIC)
  - id: lpds_structural
    description_ru: >-
      Латерализованные периодические разряды (LPDs) — очаговый процесс разной природы (острый или хронический:
      инсульт, опухоль, инфекция, в т.ч. герпетический энцефалит; постиктальное состояние); возможен ИИК.
    when:
      any_event: [lpds]
    cause_ru: Латерализованные периодические разряды (LPDs)
    cause_uz: Lateralizatsiyalangan davriy razryadlar (LPDs)
    effect_ru: Вероятен очаговый (структурный) процесс — острый или хронический; ИИК определяется отдельно (частота, +F)
    effect_uz: O‘choqli (strukturaviy) jarayon ehtimoli — o‘tkir yoki surunkali; IIC alohida baholanadi (chastota, +F)
    physiology: pathologic
    confidence: 0.65
    critical: true

  # 4) ECG artifact vs IED — resolves a candidate epileptiform transient as artifact
  - id: ecg_artifact_vs_ied
    description_ru: >-
      Острый транзиент, совпадающий с QRS ЭКГ и периодичный с ЧСС, объясняется
      ЭКГ-артефактом, а не эпилептиформным разрядом (IED).
    when:
      any_event: [ecg_artifact]
    cause_ru: ЭКГ-артефакт (совпадение с QRS, периодичность по ЧСС)
    cause_uz: EKG artefakti (QRS bilan mos, yurak urishi davriyligi)
    effect_ru: Псевдо-эпилептиформный транзиент — не истинный IED
    effect_uz: Soxta-epileptiform tranzient — haqiqiy IED emas
    physiology: artifact
    confidence: 0.8
    resolves_artifact_for: [spike, sharp_wave, ied]

  # 5) Burst-suppression: severe injury vs deep sedation/hypothermia (context split)
  - id: burst_suppression_context
    description_ru: >-
      Burst-suppression разводится по контексту: тяжёлое повреждение против обратимых причин
      (седация/анестезия, гипотермия, метаболическая/токсическая); при неуказанном контексте причина не определяется.
    when:
      any_event: [burst_suppression]
    cause_ru: Паттерн «вспышка-подавление» (burst-suppression)
    cause_uz: “Portlash-bostirish” patterni (burst-suppression)
    effect_ru: >-
      Тяжёлое диффузное повреждение ИЛИ обратимая причина (седация/анестезия, гипотермия, метаболическая/токсическая)
      — разводится по контексту: седативы, температура
    effect_uz: >-
      Og‘ir diffuz shikast YOKI qaytar sabab (sedatsiya/anesteziya, gipotermiya, metabolik/toksik)
      — kontekst bo‘yicha: sedativlar, harorat
    physiology: pathologic
    confidence: 0.6
    critical: true

  # 6) Focal slowing / asymmetry -> lateralized structural lesion
  - id: focal_slowing_structural
    description_ru: >-
      Очаговое замедление / устойчивая асимметрия указывают на возможный структурный очаг в соответствующей области;
      дифференциал — постиктальное замедление, мигрень, эффект препаратов, технические причины.
    when:
      any_event: [focal_slowing]
    cause_ru: Очаговое замедление / межполушарная асимметрия
    cause_uz: O‘choqli sekinlashuv / yarim sharlararo assimetriya
    effect_ru: Возможен структурный очаг в соответствующей области (латерализация); дифференциал — постиктальное, мигрень, препараты
    effect_uz: Tegishli sohada strukturaviy o‘choq mumkin (lateralizatsiya); differensial — postiktal, migren, dorilar
    physiology: pathologic
    confidence: 0.6

  # 7a) GPDs -> diffuse (toxic/metabolic) dysfunction; on IIC if fast/frequency criteria
  - id: gpds_diffuse
    description_ru: >-
      Генерализованные периодические разряды (GPDs) — диффузная дисфункция
      (токсическая/метаболическая/аноксическая); при +F или 1.5-2.5 Гц — на ИИК.
    when:
      any_event: [gpds]
    cause_ru: Генерализованные периодические разряды (GPDs)
    cause_uz: Umumlashgan davriy razryadlar (GPDs)
    effect_ru: Диффузная церебральная дисфункция (токсическая/метаболическая/аноксическая); возможен ИИК
    effect_uz: Diffuz serebral disfunksiya (toksik/metabolik/anoksik); IIC bo‘lishi mumkin
    physiology: pathologic
    confidence: 0.6
    critical: true

  # 7b) LRDA -> lateralized cortical irritability / structural, on IIC
  - id: lrda_structural
    description_ru: >-
      Латерализованная ритмическая дельта (LRDA) — латерализованная корковая
      раздражимость/структурный процесс; ассоциирована с судорогами (ИИК).
    when:
      any_event: [lrda]
    cause_ru: Латерализованная ритмическая дельта (LRDA)
    cause_uz: Lateralizatsiyalangan ritmik delta (LRDA)
    effect_ru: Латерализованный структурный/раздражительный процесс; связь с судорогами (ИИК)
    effect_uz: Lateralizatsiyalangan strukturaviy/qo‘zg‘aluvchi jarayon; tutqanoq bilan bog‘liq (IIC)
    physiology: pathologic
    confidence: 0.55

  # 7c) GRDA -> nonspecific encephalopathy / increased ICP
  - id: grda_nonspecific
    description_ru: >-
      Генерализованная ритмическая дельта (GRDA) — неспецифический признак диффузной (часто метаболической)
      дисфункции; связь с повышением ВЧД не доказана.
    when:
      any_event: [grda]
    cause_ru: Генерализованная ритмическая дельта (GRDA)
    cause_uz: Umumlashgan ritmik delta (GRDA)
    effect_ru: Неспецифическая диффузная дисфункция (энцефалопатия); клиническая корреляция
    effect_uz: Nospetsifik diffuz disfunksiya (ensefalopatiya); klinik korrelyatsiya
    physiology: pathologic
    confidence: 0.5

  # 7d) BIPDs -> bilateral independent structural processes
  - id: bipds_bilateral
    description_ru: >-
      Билатеральные независимые периодические разряды (BIPDs) — двусторонние
      независимые структурные/раздражительные процессы.
    when:
      any_event: [bipds]
    cause_ru: Билатеральные независимые периодические разряды (BIPDs)
    cause_uz: Ikki tomonlama mustaqil davriy razryadlar (BIPDs)
    effect_ru: Двусторонние независимые структурные процессы; высокий риск судорог (ИИК)
    effect_uz: Ikki tomonlama mustaqil strukturaviy jarayonlar; tutqanoq xavfi yuqori (IIC)
    physiology: pathologic
    confidence: 0.55
    critical: true

  # 7e) FIRDA -> deep midline / nonspecific (encephalopathy or raised ICP)
  - id: firda_nonspecific
    description_ru: >-
      Лобная интермиттирующая ритмическая дельта (FIRDA) — неспецифический признак:
      глубинная/срединная дисфункция или энцефалопатия; связь с повышением ВЧД не доказана.
    when:
      any_event: [firda]
    cause_ru: Лобная интермиттирующая ритмическая дельта (FIRDA)
    cause_uz: Peshona intermittent ritmik delta (FIRDA)
    effect_ru: Неспецифическая глубинная/срединная дисфункция или энцефалопатия; клиническая корреляция
    effect_uz: Nospetsifik chuqur/o‘rta chiziq disfunksiyasi yoki ensefalopatiya; klinik korrelyatsiya
    physiology: pathologic
    confidence: 0.5

  # 7f) Extreme delta brush -> specific (anti-NMDA-R encephalitis; extreme prematurity)
  - id: edb_specific
    description_ru: >-
      Extreme delta brush — описан при анти-NMDA-рецепторном энцефалите (у взрослых/детей), но не специфичен;
      у недоношенных delta brush — нормальный признак созревания (интерпретировать по постменструальному возрасту).
    when:
      any_event: [extreme_delta_brush]
    cause_ru: Extreme delta brush
    cause_uz: Extreme delta brush
    effect_ru: Возможен анти-NMDA-рецепторный энцефалит (не специфично); у недоношенных — норма созревания, по ПМВ
    effect_uz: Anti-NMDA-retseptor ensefaliti mumkin (nospetsifik); chala tug‘ilganlarda — yetilish normasi, PMV bo‘yicha
    physiology: pathologic
    confidence: 0.55

  # 7h) Neonatal burst-suppression -> severe neonatal encephalopathy (e.g. HIE)
  - id: neonatal_bs_hie
    description_ru: >-
      Вспышка-подавление у новорождённого — тяжёлая диффузная дисфункция; частая причина — гипоксически-ишемическая
      энцефалопатия (HIE), но возможны метаболические причины, ранние эпилептические энцефалопатии, медикаменты;
      прогностически неблагоприятно.
    when:
      any_event: [neonatal_burst_suppression]
    cause_ru: Неонатальная вспышка-подавление (aEEG BS)
    cause_uz: Neonatal portlash-bostirish (aEEG BS)
    effect_ru: Тяжёлая диффузная дисфункция (частая причина — HIE; также метаболические, эпилептические энцефалопатии, препараты)
    effect_uz: Og‘ir diffuz disfunksiya (tez-tez sabab — HIE; shuningdek metabolik, epileptik ensefalopatiya, dorilar)
    physiology: pathologic
    confidence: 0.65
    critical: true

  # 7i) Neonatal inactive/flat trace -> very severe injury
  - id: neonatal_inactive_severe
    description_ru: >-
      Неактивная (изоэлектрическая) кривая у новорождённого — возможно крайне тяжёлое повреждение мозга после
      исключения седации, гипотермии и технических причин; требует срочной оценки.
    when:
      any_event: [neonatal_inactive]
    cause_ru: Неонатальная неактивная кривая (изоэлектрия)
    cause_uz: Neonatal faolsiz egri (izoelektrik)
    effect_ru: Возможно крайне тяжёлое повреждение мозга (после исключения седации, гипотермии, технических причин)
    effect_uz: O‘ta og‘ir miya shikasti mumkin (sedatsiya, gipotermiya, texnik sabablar chiqarilgandan keyin)
    physiology: pathologic
    confidence: 0.6
    critical: true

  # (Wicket benign-variant resolution of spikes is handled by the plausibility
  #  engine + Layer 5 variant resolution, not a generic chain — see rules_engine.)

  # (Rule 8 "physiologic slowing on activation/drowsiness" was removed in increment 64: no detector emits `drowsiness_slowing`.
  #  Re-add it together with a validated drowsiness/activation detector.)
