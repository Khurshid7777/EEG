# Confidence thresholds, mode-B gates, and alarm budget (TZ §2, §10, §16).
detection_min_confidence: 0.5

mode_b:                         # Autonomous mode gates (TZ §2B)
  min_confidence: 0.85
  min_signal_quality: 0.6
  max_artifact_fraction: 0.3
  require_plausible: true

max_false_alarms_per_hour: 2.0  # cEEG alarm budget (placeholder; real-time is v2)

# Detector thresholds (kept in config, never hardcoded — TZ §0)
diffuse_slowing_delta_theta_ratio: 0.55
asymmetry_index_abnormal: 0.5      # legacy (report's global asymmetry)
focal_slowing_min_diff: 0.25        # increment 17: persistent relative slow-power difference
suppression_amplitude_uv: 10.0
burst_suppression_ratio: 0.5
ictal_min_duration_s: 8.0        # sustained rhythmic discharge to call ictal
ictal_rhythmicity: 0.45          # peak-band power concentration (0..1)
ictal_amplitude_factor: 1.5      # amplitude rise vs channel baseline
ictal_min_channels: 1             # spatial extent (channels per ictal cluster); tuned on CHB-MIT, see thresholds.physionet.yaml

# Periodic discharges (GPD/LPD/BIPD) — ACNS 2021 (§7.4)
generalized_channel_fraction: 0.6  # >= this fraction of channels involved -> generalized
pd_min_discharges: 6               # min discharges to call a pattern periodic
pd_isi_cv_max: 0.35                # max coeff. of variation of inter-discharge interval
pd_freq_hz_min: 0.5
pd_freq_hz_max: 3.0
pd_plus_fast_ratio: 0.15
pd_min_duration_s: 10.0
# increment 18: ECG mimic = cardiac rate with almost perfect regularity; ocular = Fp/F7/F8
# dominant. Set by evaluation/prereg18.apply_decision.
pd_mimic_uncertain: true
pd_ecg_freq_hz: [0.75, 2.0]        # adults (and unknown age): 45-120 /min
# increment 20: cardiac rate is age-dependent (children: Fleming et al., Lancet 2011, 1st-99th
# centiles) and sinus rhythm is not perfectly regular (respiratory sinus arrhythmia).
# Set by evaluation/prereg20.apply_decision.
pd_ecg_freq_hz_by_age:             # [age below (years), lo Hz, hi Hz]
  - [1, 1.55, 3.0]                 # infants: 93-181 /min
  - [2, 1.35, 2.6]                 # 82-156 /min
  - [4, 1.15, 2.4]                 # 70-142 /min
  - [8, 1.0, 2.2]                  # 59-131 /min
pd_ecg_isi_cv_max: 0.10
# increment 20: the learned seizure detector was validated on long-term monitoring only; on
# routine-length EEG its events are candidates for review. Set by prereg20.apply_decision.
ictal_ml_routine_uncertain: true
# increment 20 (development, not pre-registered): the "alert" estimate (upper quartile of
# 10-s epoch peaks) fixed as many normal as it lost abnormal recordings (any quantile) -> off.
pdr_method: whole
routine_max_duration_s: 2700       # < 45 min = routine EEG

# Rhythmic delta activity (GRDA/LRDA)
rda_min_duration_s: 6.0
rda_rhythmicity: 0.4                # legacy spectral concentration (FIRDA/triphasic only)
# increment 17: rhythmic = delta-band autocorrelation >= this at one period in 6 s
# windows (hop 2 s); GRDA >= 60% of channels of both hemispheres simultaneously
rda_autocorr_min: 0.7
grda_min_windows: 2                 # 8 s
lrda_min_windows: 3                 # 10 s, >= 2 channels of one hemisphere

# Ictal-interictal continuum
iic_freq_hz_min: 1.5
iic_freq_hz_max: 2.5

# FIRDA (frontal intermittent rhythmic delta)
firda_max_continuous_fraction: 0.7  # must be intermittent (below this) to be FIRDA
firda_min_runs: 2

# Extreme delta brush
edb_beta_ratio: 0.12                # beta power fraction on delta crests
