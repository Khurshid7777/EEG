<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NeuroLens — региональная карта коры</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16202a;--mut:#56626f;--line:#d6dce3;--acc:#1b5fd1;--accbg:#e6efff;--warn:#b4400a;--warnbg:#fff1e6;--ok:#146c34;--chip:#eef1f4}
@media (prefers-color-scheme:dark){:root{--bg:#0f141a;--card:#171e26;--ink:#e8edf2;--mut:#9aa7b4;--line:#2b3641;--acc:#6aa2ff;--accbg:#1b2c4a;--warn:#ff9d5c;--warnbg:#3a2415;--ok:#5fd18a;--chip:#222c37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header,main{max-width:1280px;margin:0 auto;padding:0 16px}
header{padding-top:14px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px}
.caveat{margin:10px 0;padding:8px 12px;border:1px solid var(--warn);background:var(--warnbg);border-radius:8px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grp>span.lbl{color:var(--mut);font-size:12px;margin-right:2px}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:5px 10px;border-radius:7px;cursor:pointer}
button[aria-pressed=true]{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
#tl{width:100%;display:block;touch-action:none;cursor:col-resize}
.grid{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:12px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.right{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:1100px){.right{grid-template-columns:1fr}}
#map{display:block;margin:0 auto;max-width:100%}
.cb{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:var(--mut);margin-top:6px}
#cbc{width:160px;height:10px;border-radius:5px;border:1px solid var(--line)}
#slider{width:100%}
.cap p{margin:4px 0}
.badge{display:inline-block;padding:1px 7px;border-radius:9px;background:var(--chip);font-size:12px;margin-right:4px}
.badge.w{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr.ev{cursor:pointer}tr.ev:hover{background:var(--accbg)}tr.cur{background:var(--accbg)}
.evwrap{max-height:230px;overflow:auto}
svg text{fill:var(--ink);font-size:11px}
.note{font-size:12px;color:var(--mut)}
.imp{font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
<h1 id="ttl"></h1>
<div class="sub" id="sub"></div>
<div class="caveat" id="cav" role="note"></div>
<div class="bar">
 <div class="grp" id="gband"><span class="lbl" id="lband"></span></div>
 <div class="grp" id="gmetric"><span class="lbl" id="lmetric"></span></div>
 <div class="grp" id="gview"><span class="lbl" id="lview"></span></div>
 <div class="grp" id="gmode"></div>
 <div class="grp" id="glang"></div>
</div>
</header>
<main>
<section class="card"><h2 id="h_tl"></h2><canvas id="tl" tabindex="0" role="img" aria-label="timeline"></canvas>
 <input id="slider" type="range" min="0" value="0" aria-label="window"></section>
<div class="grid">
 <section class="card"><h2 id="h_map"></h2><canvas id="map" role="img" aria-label="map"></canvas>
  <div class="cb"><span id="cbmin"></span><canvas id="cbc" width="160" height="10"></canvas><span id="cbmax"></span></div>
  <div class="note" id="mapnote" style="text-align:center;margin-top:4px"></div></section>
 <div class="right">
  <section class="card"><h2 id="h_cap"></h2><div class="cap" id="cap"></div></section>

  <section class="card" style="grid-column:1/-1"><h2 id="h_ev"></h2><div class="evwrap"><table id="evt"></table></div></section>
  <section class="card" style="grid-column:1/-1" id="impcard"><h2 id="h_imp"></h2><div class="imp" id="imp"></div></section>
 </div>
</div>

 const fl=Object.entries(V.asymmetry_record).filter(([,v])=>v.flag);
 $('asnote').innerHTML=(fl.length?`<span class="badge w">${L.asrec}</span> `+fl.map(([k,v])=>`${k} (${v.flag==='right>left'?L.rgt:L.lft}, ln ${v.ai})`).join('; '):`<span class="badge">${L.asnone}</span>`)+`<br>${L.asnote}`}
// ---------- caption / events ----------
function whereTxt(e){const L=T[st.lang];if(!e.where.length)return L.noloc;const seen=new Set();return e.where.map(w=>{const s=w.side==='mid'?'':' '+(w.side==='L'?L.L:L.R);const t=`${L.reg[w.region]}${s}`;return t}).filter(t=>!seen.has(t)&&seen.add(t)).join(', ')}
function caption(){
 const L=T[st.lang],w=st.all?-1:st.w,b=st.band;let h='';
 if(st.pinA!==null&&!st.all){let bi=0,bv=0;CELLS.forEach((c,ci)=>{const v=cellVal(ci,w<0?0:st.w,b)-cellVal(ci,st.pinA,b);if(Math.abs(v)>Math.abs(bv)){bv=v;bi=ci}});h+=`<p>${L.diffmax(`${L.reg[CELLS[bi].r]} ${CELLS[bi].s==='L'?L.L:L.R}`,(bv>0?'+':'')+bv.toFixed(3))}</p>`}
 else{let bi=0,bv=-1e9;CELLS.forEach((c,ci)=>{const v=metricCell(ci,w,b);if(v>bv){bv=v;bi=ci}});h+=`<p>${L.maxb(L[b],`${L.reg[CELLS[bi].r]} ${CELLS[bi].s==='L'?L.L:L.R}`,bv.toFixed(2)+(st.metric==='z'?' z':''))}</p>`}
 if(!st.all){if(S.artefact[st.w])h+=`<p><span class="badge w">!</span>${L.art}</p>`;
  const ev=eventsInWindow(st.w);h+=ev.length?`<p>${L.evin}</p><p>`+ev.slice(0,8).map(e=>`<span class="badge">${evLbl(e)}${e.channels.length?' · '+e.channels.join(','):''}${e.where.length?' → '+whereTxt(e):''}</span>`).join(' ')+(ev.length>8?` +${ev.length-8}`:'')+'</p>':`<p class="note">${L.ev0}</p>`}
 h+=`<p class="note">${L.spec}</p>`;$('cap').innerHTML=h}
function evTable(){const L=T[st.lang];const evs=[...V.events].sort((a,b)=>a.t0-b.t0);const cur=st.all?new Set():new Set(eventsInWindow(st.w));
 let h=`<tr>${L.evcols.map(c=>`<th>${c}</th>`).join('')}</tr>`;evs.slice(0,300).forEach((e,i)=>{h+=`<tr class="ev${cur.has(e)?' cur':''}" data-w="${Math.floor(e.t0/WS)}"><td>${e.t0.toFixed(1)}</td><td>${evLbl(e)}</td><td>${whereTxt(e)}</td><td>${e.conf.toFixed(2)}</td></tr>`});
 if(!evs.length)h=`<tr><td class="note">${L.noev}</td></tr>`;if(evs.length>300)h+=`<tr><td colspan=4 class="note">… +${evs.length-300}</td></tr>`;$('evt').innerHTML=h;
 $('evt').querySelectorAll('tr.ev').forEach(r=>r.onclick=()=>setW(+r.dataset.w))}
// ---------- UI ----------
function mkbtn(par,id,label,pressed,fn){let b=$(id);if(!b){b=document.createElement('button');b.id=id;par.appendChild(b);b.onclick=fn}b.textContent=label;b.setAttribute('aria-pressed',pressed?'true':'false')}
function ui(){const L=T[st.lang];document.documentElement.lang=st.lang;$('ttl').textContent=V.title&&st.lang==='ru'?V.title:L.ttl;$('sub').textContent=L.sub(S.duration_s,S.channels.length,WS);$('cav').textContent=V.caveat[st.lang];
 $('lband').textContent=L.band+':';$('lmetric').textContent=L.metric+':';$('lview').textContent=L.view+':';
 BANDS.forEach(b=>mkbtn($('gband'),'b_'+b,L[b],st.band===b,()=>{st.band=b;refresh()}));
 mkbtn($('gmetric'),'m_rel',L.rel,st.metric==='rel',()=>{st.metric='rel';refresh()});mkbtn($('gmetric'),'m_z',L.z,st.metric==='z',()=>{st.metric='z';refresh()});
 mkbtn($('gview'),'v_topo',L.topo,st.view==='topo',()=>{st.view='topo';refresh()});mkbtn($('gview'),'v_cells',L.cells,st.view==='cells',()=>{st.view='cells';refresh()});
 mkbtn($('gmode'),'k_all',L.all,st.all,()=>{st.all=!st.all;refresh()});
 mkbtn($('gmode'),'k_play',st.timer?L.pause:L.play,!!st.timer,()=>{if(st.timer){clearInterval(st.timer);st.timer=null}else{st.all=false;st.timer=setInterval(()=>{setW(st.w+1>=NW?0:st.w+1)},500)}ui()});
 mkbtn($('gmode'),'k_pin',st.pinA===null?L.pinA:L.clearA,st.pinA!==null,()=>{st.pinA=st.pinA===null?st.w:null;refresh()});
 mkbtn($('glang'),'l_ru','RU',st.lang==='ru',()=>{st.lang='ru';ui();refresh()});mkbtn($('glang'),'l_uz','UZ',st.lang==='uz',()=>{st.lang='uz';ui();refresh()});
 ['h_tl','h_map','h_cap','h_as','h_ev','h_imp'].forEach(k=>$(k).textContent=L[k]);
 const imp=st.lang==='uz'?V.record.impression_uz:V.record.impression_ru;$('imp').textContent=imp||L.noimp;
 $('foot').textContent=`${L.foot} ${V.norms.version}; ${V.norms.fit}. ${V.norms.checked_on}.`}
function refresh(){ui();drawTL();drawMap();asym();caption();evTable();$('slider').max=NW-1}
$('slider').addEventListener('input',e=>setW(+e.target.value));
window.addEventListener('resize',()=>{drawTL();asym()});
refresh();
})();
</script>
</body>
