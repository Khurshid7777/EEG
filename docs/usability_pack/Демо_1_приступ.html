<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NeuroLens — региональная карта коры</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16202a;--mut:#56626f;--line:#d6dce3;--acc:#1b5fd1;--accbg:#e6efff;--warn:#b4400a;--warnbg:#fff1e6;--ok:#146c34;--chip:#eef1f4}
@media (prefers-color-scheme:dark){:root{--bg:#0f141a;--card:#171e26;--ink:#e8edf2;--mut:#9aa7b4;--line:#2b3641;--acc:#6aa2ff;--accbg:#1b2c4a;--warn:#ff9d5c;--warnbg:#3a2415;--ok:#5fd18a;--chip:#222c37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header,main{max-width:1280px;margin:0 auto;padding:0 16px}
header{padding-top:14px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px}
.caveat{margin:10px 0;padding:8px 12px;border:1px solid var(--warn);background:var(--warnbg);border-radius:8px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.grp>span.lbl{color:var(--mut);font-size:12px;margin-right:2px}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:5px 10px;border-radius:7px;cursor:pointer}
button[aria-pressed=true]{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
#tl{width:100%;display:block;touch-action:none;cursor:col-resize}
.grid{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:12px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.right{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:1100px){.right{grid-template-columns:1fr}}
#map{display:block;margin:0 auto;max-width:100%}
.cb{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:var(--mut);margin-top:6px}
#cbc{width:160px;height:10px;border-radius:5px;border:1px solid var(--line)}
#slider{width:100%}
.cap p{margin:4px 0}
.badge{display:inline-block;padding:1px 7px;border-radius:9px;background:var(--chip);font-size:12px;margin-right:4px}
.badge.w{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr.ev{cursor:pointer}tr.ev:hover{background:var(--accbg)}tr.cur{background:var(--accbg)}
.evwrap{max-height:230px;overflow:auto}
svg text{fill:var(--ink);font-size:11px}
.note{font-size:12px;color:var(--mut)}
.imp{font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
<h1 id="ttl"></h1>
<div class="sub" id="sub"></div>
<div class="caveat" id="cav" role="note"></div>
<div class="bar">
 <div class="grp" id="gband"><span class="lbl" id="lband"></span></div>
 <div class="grp" id="gmetric"><span class="lbl" id="lmetric"></span></div>
 <div class="grp" id="gview"><span class="lbl" id="lview"></span></div>
 <div class="grp" id="gmode"></div>
 <div class="grp" id="glang"></div>
</div>
</header>
<main>
<section class="card"><h2 id="h_tl"></h2><canvas id="tl" tabindex="0" role="img" aria-label="timeline"></canvas>
 <input id="slider" type="range" min="0" value="0" aria-label="window"></section>
<div class="grid">
 <section class="card"><h2 id="h_map"></h2><canvas id="map" role="img" aria-label="map"></canvas>
  <div class="cb"><span id="cbmin"></span><canvas id="cbc" width="160" height="10"></canvas><span id="cbmax"></span></div>
  <div class="note" id="mapnote" style="text-align:center;margin-top:4px"></div></section>
 <div class="right">
  <section class="card"><h2 id="h_cap"></h2><div class="cap" id="cap"></div></section>
  <section class="card"><h2 id="h_as"></h2><svg id="asv" width="100%" height="230" role="img"></svg><div class="note" id="asnote"></div></section>
  <section class="card" style="grid-column:1/-1"><h2 id="h_ev"></h2><div class="evwrap"><table id="evt"></table></div></section>
  <section class="card" style="grid-column:1/-1" id="impcard"><h2 id="h_imp"></h2><div class="imp" id="imp"></div></section>
 </div>
</div>
<p class="note" id="foot"></p>
</main>

 // events in window: ring on electrodes
 const evw=st.all?[]:eventsInWindow(st.w);const hot=new Set();evw.forEach(e=>e.channels.forEach(c=>hot.add(c)));
 mctx.font='10px system-ui';mctx.textAlign='center';
 el.forEach(e=>{const [X,Y]=px(e.x,e.y);mctx.beginPath();mctx.arc(X,Y,hot.has(e.c)?7:3,0,7);if(hot.has(e.c)){mctx.lineWidth=2.4;mctx.strokeStyle='#fff';mctx.stroke();mctx.lineWidth=1.2;mctx.strokeStyle='#000';mctx.stroke()}else{mctx.fillStyle='rgba(0,0,0,.75)';mctx.fill()}
  mctx.fillStyle='#fff';mctx.strokeStyle='rgba(0,0,0,.65)';mctx.lineWidth=3;mctx.strokeText(e.c,X,Y-8);mctx.fillText(e.c,X,Y-8)});

 // L / R labels

 // colour bar
 const cb=$('cbc').getContext('2d');for(let i=0;i<160;i++){const [r,g,bl]=colour(sc[0]+(sc[1]-sc[0])*i/159,sc);cb.fillStyle=`rgb(${r},${g},${bl})`;cb.fillRect(i,0,1,10)}

}
const wlabel=w=>`${(w*WS).toFixed(0)}–${((w+1)*WS).toFixed(0)} ${T[st.lang].s}`;
function eventsInWindow(w){const a=w*WS,b=(w+1)*WS;return V.events.filter(e=>e.t1>=a&&e.t0<b)}
// ---------- timeline ----------
const tl=$('tl'),tctx=tl.getContext('2d');const LM=104;let lanes=[],tlH=0;
const EVC={spike:'#d1342f',ictal_ml:'#8a1c7c',ictal:'#8a1c7c',focal_slowing:'#c27a00',diffuse_slowing:'#9a6b00',wicket:'#2d7d6f',burst_suppression:'#4b3fa0',gped:'#a02060',lpd:'#a02060',periodic:'#a02060'};
const SHORT={ru:{spike:'Спайк',ictal_ml:'Приступ (ML)',ictal:'Приступ',focal_slowing:'Фок. замедл.',diffuse_slowing:'Диффуз. замедл.',wicket:'Wicket',burst_suppression:'Вспышка-подавл.',gped:'ГПД',lpd:'ЛПД',periodic:'Периодич.'},uz:{spike:'Spayk',ictal_ml:'Tutqanoq (ML)',ictal:'Tutqanoq',focal_slowing:'Fokal sekinl.',diffuse_slowing:'Diffuz sekinl.',wicket:'Wicket',burst_suppression:'Portlash-bosilish',gped:'GPD',lpd:'LPD',periodic:'Davriy'}};
function shortLbl(c){const t=(SHORT[st.lang]||SHORT.ru)[c];if(t)return t;const l=(V.events.find(e=>e.code===c)||{}).label||c;return l.length>15?l.slice(0,14)+'…':l}
const evCodes=[...new Set(V.events.map(e=>e.code))];
const STG=['W','N1','N2','N3','REM'],STC={W:'#d9a441',N1:'#8fb3e8',N2:'#4a82d9',N3:'#1f3c88',REM:'#c25ab0'};
function drawTL(){
 const d=window.devicePixelRatio||1,Wc=tl.clientWidth||900;const hyp=V.hypnogram&&V.hypnogram.length;

 tl.width=Wc*d;tl.height=tlH*d;tl.style.height=tlH+'px';tctx.setTransform(d,0,0,d,0,0);tctx.clearRect(0,0,Wc,tlH);
 const ink=getComputedStyle(document.body).color,mut=getComputedStyle(document.body).getPropertyValue('--mut');
 const X0=LM,XW=Wc-LM-8,tx=t=>X0+t/S.duration_s*XW;
 tctx.font='11px system-ui';tctx.fillStyle=mut;tctx.textAlign='center';
 const step=niceStep(S.duration_s/Math.max(4,XW/90));for(let t=0;t<=S.duration_s;t+=step){tctx.fillText(Math.round(t)+'',tx(t),12);tctx.fillStyle='rgba(128,128,128,.25)';tctx.fillRect(tx(t),16,1,tlH-16);tctx.fillStyle=mut}
 let y=22;tctx.textAlign='right';
 if(hyp){tctx.fillStyle=mut;tctx.fillText('Сон / Uyqu',LM-6,y+11);V.hypnogram.forEach((s,i)=>{const t0=i*30,t1=Math.min((i+1)*30,S.duration_s);if(t0>=S.duration_s)return;tctx.fillStyle=STC[s]||'#999';tctx.fillRect(tx(t0),y,Math.max(1,tx(t1)-tx(t0)),14)});y+=18}
 evCodes.forEach(c=>{tctx.fillStyle=mut;tctx.textAlign='right';tctx.fillText(shortLbl(c),LM-6,y+11);tctx.fillStyle=EVC[c]||'#555';V.events.filter(e=>e.code===c).forEach(e=>{tctx.fillRect(tx(e.t0),y+1,Math.max(2,tx(e.t1)-tx(e.t0)),laneH-3)});y+=laneH});
 y+=6;st._stripY=y;
 const L=T[st.lang];const rows=CELLS.map((c,i)=>({c,i}));
 const bandNow=st.band;const sc2=st.metric==='z'?[-3,3,true]:scaleFor0();
 rows.forEach((r,k)=>{tctx.fillStyle=mut;tctx.textAlign='right';tctx.fillText(`${L.reg[r.c.r].slice(0,5)}. ${r.c.s}`,LM-6,y+k*ROW+10);
  const cw=XW/NW;for(let w=0;w<NW;w++){const v=st.metric==='z'?Math.max(-4,Math.min(4,(cellVal(r.i,w,bandNow,'rel')-ZS[bandNow][r.i].med)/ZS[bandNow][r.i].mad)):cellVal(r.i,w,bandNow);const [R,G,B]=colour(v,sc2);tctx.fillStyle=`rgb(${R},${G},${B})`;tctx.fillRect(X0+w*cw,y+k*ROW,Math.ceil(cw)+0.5,ROW-1)}});
 // artefact windows
 const cw=XW/NW;tctx.fillStyle='rgba(120,120,120,.55)';for(let w=0;w<NW;w++)if(S.artefact[w])tctx.fillRect(X0+w*cw,y,Math.ceil(cw),rowsS*ROW);
 // cursor
 if(!st.all){tctx.fillStyle='rgba(27,95,209,.18)';tctx.fillRect(X0+st.w*cw,16,Math.max(2,cw),tlH-16);tctx.fillStyle='#1b5fd1';tctx.fillRect(X0+st.w*cw,16,2,tlH-16);
  if(st.pinA!==null){tctx.fillStyle='#b4400a';tctx.fillRect(X0+st.pinA*cw,16,2,tlH-16);tctx.textAlign='left';tctx.fillText('A',X0+st.pinA*cw+4,26)}}

function scaleFor0(){const a=[];useW.forEach(w=>CELLS.forEach((_,ci)=>a.push(cellVal(ci,w,st.band))));a.sort((x,y)=>x-y);return[a[Math.floor(a.length*.02)],a[Math.min(a.length-1,Math.floor(a.length*.98))]||1,false]}
function niceStep(x){const p=10**Math.floor(Math.log10(x)),f=x/p;return(f<1.5?1:f<3.5?2:f<7.5?5:10)*p}
function setW(w){st.all=false;st.w=Math.max(0,Math.min(NW-1,w));$('slider').value=st.w;refresh()}
function pick(ev){const g=tl._geo;if(!g)return;const r=tl.getBoundingClientRect();const x=ev.clientX-r.left;setW(Math.floor((x-g.X0)/g.cw))}
let drag=false;tl.addEventListener('pointerdown',e=>{drag=true;tl.setPointerCapture(e.pointerId);pick(e)});tl.addEventListener('pointermove',e=>{if(drag)pick(e)});tl.addEventListener('pointerup',()=>drag=false);

function asym(){
 const L=T[st.lang],svg=$('asv'),Wd=svg.clientWidth||340,PR=V.pairs.filter(p=>V.asymmetry_record[p]),H=Math.max(90,PR.length*28+26),m=46,rowH=(H-26)/Math.max(1,PR.length);svg.setAttribute('height',H);

 PR.forEach((p,i)=>{const y=22+i*rowH,rec=V.asymmetry_record[p];const [l,r]=p.split('-');

  if(!st.all){const a=S.log10_abs_alpha;if(chIdx[l]!==undefined&&chIdx[r]!==undefined&&!S.artefact[st.w]){const v=(a[chIdx[r]][st.w]-a[chIdx[l]][st.w])*Math.LN10;h+=`<circle cx="${ax(v)}" cy="${y+rowH/2}" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>`}}

function whereTxt(e){const L=T[st.lang];if(!e.where.length)return L.noloc;const seen=new Set();return e.where.map(w=>{const s=w.side==='mid'?'':' '+(w.side==='L'?L.L:L.R);const t=`${L.reg[w.region]}${s}`;return t}).filter(t=>!seen.has(t)&&seen.add(t)).join(', ')}
function caption(){
 const L=T[st.lang],w=st.all?-1:st.w,b=st.band;let h='';
 if(st.pinA!==null&&!st.all){let bi=0,bv=0;CELLS.forEach((c,ci)=>{const v=cellVal(ci,w<0?0:st.w,b)-cellVal(ci,st.pinA,b);if(Math.abs(v)>Math.abs(bv)){bv=v;bi=ci}});h+=`<p>${L.diffmax(`${L.reg[CELLS[bi].r]} ${CELLS[bi].s==='L'?L.L:L.R}`,(bv>0?'+':'')+bv.toFixed(3))}</p>`}
 else{let bi=0,bv=-1e9;CELLS.forEach((c,ci)=>{const v=metricCell(ci,w,b);if(v>bv){bv=v;bi=ci}});h+=`<p>${L.maxb(L[b],`${L.reg[CELLS[bi].r]} ${CELLS[bi].s==='L'?L.L:L.R}`,bv.toFixed(2)+(st.metric==='z'?' z':''))}</p>`}
 if(!st.all){if(S.artefact[st.w])h+=`<p><span class="badge w">!</span>${L.art}</p>`;
  const ev=eventsInWindow(st.w);h+=ev.length?`<p>${L.evin}</p><p>`+ev.slice(0,8).map(e=>`<span class="badge">${esc(evLbl(e))}${e.channels.length?' · '+esc(e.channels.join(',')):''}${e.where.length?' → '+esc(whereTxt(e)):''}</span>`).join(' ')+(ev.length>8?` +${ev.length-8}`:'')+'</p>':`<p class="note">${L.ev0}</p>`}
 if(V.hypnogram&&V.hypnogram.length&&st.metric==='rel')h+=`<p><span class="badge w">!</span>${L.sleepwarn}</p>`;

 let h=`<tr>${L.evcols.map(c=>`<th>${c}</th>`).join('')}</tr>`;evs.slice(0,300).forEach((e,i)=>{h+=`<tr class="ev${cur.has(e)?' cur':''}" data-w="${Math.floor(e.t0/WS)}"><td>${e.t0.toFixed(1)}</td><td>${esc(evLbl(e))}</td><td>${esc(whereTxt(e))}</td><td>${e.conf.toFixed(2)}</td></tr>`});

function mkbtn(par,id,label,pressed,fn){let b=$(id);if(!b){b=document.createElement('button');b.id=id;par.appendChild(b);b.onclick=fn}b.textContent=label;b.setAttribute('aria-pressed',pressed?'true':'false')}
function ui(){const L=T[st.lang];document.documentElement.lang=st.lang;$('ttl').textContent=V.title&&st.lang==='ru'?V.title:L.ttl;$('sub').textContent=L.sub(S.duration_s,S.channels.length,WS)+(S.reference==='recorded'?' · '+L.refrec:'');$('cav').textContent=V.caveat[st.lang];
 $('lband').textContent=L.band+':';$('lmetric').textContent=L.metric+':';$('lview').textContent=L.view+':';
